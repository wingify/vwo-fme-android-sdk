# workflow_dispatch from master → upload to Maven Central Portal
# (USER_MANAGED: publish the draft at https://central.sonatype.com/publishing/deployments).
#
# GitHub secrets that MUST exist (exported as env on the Publish step):
#   MAVEN_CENTRAL_USERNAME  — Central Portal username (local.properties: mavenCentralUsername)
#   MAVEN_CENTRAL_PASSWORD  — Central Portal token     (local.properties: mavenCentralPassword)
#   SIGNING_SECRET_KEY      — ASCII-armored GPG private key. CI has no secring.gpg, so Gradle
#                             uses useInMemoryPgpKeys(); do not set signing.keyId / secretKeyRingFile.
#   SIGNING_PASSWORD        — passphrase for that key  (local.properties: signing.password)
#   SLACK_NOTIFICATIONS_BOT_TOKEN — Slack status ping (not used by Gradle)
#
# Not secrets / not exported:
#   signing.keyId + signing.secretKeyRingFile — laptop-only; ignored when SIGNING_SECRET_KEY is set
#   POM_DEVELOPER_* — local.properties only; CI POM falls back to gradle defaults
#
# Unit tests run first unless skip_tests is checked. Publish waits for them when they run.
# Missing secrets fail the job. Slack notifies only when SLACK_NOTIFICATIONS_BOT_TOKEN is set.
# After publish, if the latest GitHub release version differs from this tag, create or
# update that release from the matching CHANGELOG.md section (GITHUB_TOKEN, contents: write).
name: Maven Central Release

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: 'Which SDK to publish'
        type: choice
        options:
          - both
          - vwo
          - wingify
        default: both
      tag:
        description: 'Existing tag to release (e.g. v1.70.0). Must already be on master.'
        required: true
        type: string
      skip_tests:
        description: 'Skip unit tests'
        type: boolean
        default: false

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ github.event.inputs.artifact || 'both' }}
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#refs/tags/}"
          VERSION="${TAG#v}"
          GRADLE_VERSION="$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          ARTIFACT="${{ github.event.inputs.artifact || 'both' }}"

          echo "ref=${GITHUB_REF} branch=${GITHUB_REF_NAME}"
          echo "tag=${TAG}"
          echo "gradle.properties VERSION_NAME=${GRADLE_VERSION}"
          echo "artifact=${ARTIFACT}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+ ]]; then
            echo "::error::Need a vX.Y.Z tag in the workflow_dispatch tag input."
            exit 1
          fi
          if [ "$VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version ${VERSION} does not match gradle.properties VERSION_NAME=${GRADLE_VERSION}"
            exit 1
          fi

          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::HEAD is not on origin/master. Tag/commit must already be merged."
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Check secrets
        id: secrets
        if: always()
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SLACK_NOTIFICATIONS_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SLACK_NOTIFICATIONS_BOT_TOKEN}" ]; then
            echo "slack_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "slack_ok=false" >> "$GITHUB_OUTPUT"
          fi
          missing=""
          for v in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_SECRET_KEY SIGNING_PASSWORD SLACK_NOTIFICATIONS_BOT_TOKEN; do
            if [ -z "${!v}" ]; then
              missing="${missing:+$missing }$v"
            fi
          done
          if [ -n "$missing" ]; then
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "::error::Missing required secrets: $missing"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 still defaults to the removed `tools` package.
          packages: platform-tools

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=${ANDROID_HOME}" >> local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        id: unit-tests
        if: github.event.inputs.skip_tests != 'true'
        run: ./gradlew :fme-android:testDebugUnitTest --no-daemon

      - name: Publish
        if: success() && steps.secrets.outcome == 'success' && (github.event.inputs.skip_tests == 'true' || steps.unit-tests.outcome == 'success')
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_SECRET_KEY: ${{ secrets.SIGNING_SECRET_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          ARTIFACT="${{ steps.meta.outputs.artifact }}"
          echo "Uploading to Maven Central Portal (USER_MANAGED; publish at https://central.sonatype.com/publishing/deployments)"
          VWO_TASK=:fme-android:publishReleasePublicationToCentralPortal
          WINGIFY_TASK=:fme-android:publishWingifyReleasePublicationToCentralPortal
          case "$ARTIFACT" in
            vwo) ./gradlew "$VWO_TASK" --no-daemon ;;
            wingify) ./gradlew "$WINGIFY_TASK" --no-daemon ;;
            *) ./gradlew "$VWO_TASK" "$WINGIFY_TASK" --no-daemon ;;
          esac

      - name: GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARTIFACT: ${{ steps.meta.outputs.artifact }}
        run: |
          set -euo pipefail
          case "$ARTIFACT" in
            vwo) TITLE="[VWO] ${TAG}" ;;
            wingify) TITLE="[Wingify] ${TAG}" ;;
            *) TITLE="${TAG}" ;;
          esac
          EXISTING="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          echo "latest=${EXISTING:-<none>} tag=${TAG} title=${TITLE}"
          if [ "${EXISTING#v}" = "$VERSION" ]; then
            echo "Latest GitHub release already matches ${TAG}. Skipping."
            exit 0
          fi
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1 }
            capture && seen && /^## \[/ { exit }
            capture { print; seen=1 }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md --target "$TAG" --verify-tag
          fi

      - name: Notification
        if: always() && steps.secrets.outputs.slack_ok == 'true'
        uses: wingify/slack-github-action@v1.15.1-wingify
        with:
          channel-id: 'vwo-fs-fme-sdk-job-status'
          slack-message: "${{ job.status == 'success' && format('<!here> :rocket: *Android FME {0}*\n{1}\n<https://central.sonatype.com/publishing/deployments|Publish the draft>  ·  <https://github.com/{2}/releases/latest|Latest release>  ·  <https://github.com/{2}/actions/runs/{3}|View run>', steps.meta.outputs.version || github.ref_name, steps.meta.outputs.artifact == 'vwo' && '*VWO* published to the Maven Central Portal.' || steps.meta.outputs.artifact == 'wingify' && '*Wingify* published to the Maven Central Portal.' || '*VWO* & *Wingify* both published to the Maven Central Portal.', github.repository, github.run_id) || format('<!here> Android FME Maven release *{0}* ({1}) failed :x:{2}\nhttps://github.com/{3}/actions/runs/{4}', steps.meta.outputs.version || github.ref_name, steps.meta.outputs.artifact || github.event.inputs.artifact || 'both', steps.secrets.outputs.missing && format('\nMissing secrets: `{0}`', steps.secrets.outputs.missing) || '', github.repository, github.run_id) }}"
          color: "${{ job.status == 'success' && '#00FF00' || '#FF0000' }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
